<!doctype html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>ListNote アイコン生成</title>

  <style>

    body {

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f7fb;

      color: #1f2937;

    }

    .wrap {

      max-width: 900px;

      margin: 0 auto;

    }

    h1 {

      margin: 0 0 10px;

      font-size: 28px;

    }

    p {

      line-height: 1.7;

      color: #4b5563;

    }

    .card {

      background: white;

      border-radius: 16px;

      padding: 18px;

      box-shadow: 0 8px 24px rgba(0,0,0,0.08);

      margin-top: 16px;

    }

    button {

      border: none;

      background: #5B5BF7;

      color: white;

      padding: 12px 16px;

      border-radius: 12px;

      cursor: pointer;

      font-size: 14px;

      font-weight: 700;

      margin-right: 8px;

      margin-bottom: 8px;

    }

    .msg {

      margin-top: 12px;

      font-size: 14px;

      color: #2563eb;

      font-weight: 600;

    }

    .grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

      gap: 16px;

      margin-top: 16px;

    }

    .item {

      border: 1px solid #e5e7eb;

      border-radius: 16px;

      padding: 16px;

      text-align: center;

      background: #fff;

    }

    .item img {

      width: 120px;

      height: 120px;

      border-radius: 24px;

      display: block;

      margin: 0 auto 12px;

      background: #f3f4f6;

    }

    .filename {

      font-weight: 700;

      margin-bottom: 8px;

    }

    .help {

      font-size: 13px;

      color: #6b7280;

      line-height: 1.6;

    }

    a.save-link {

      display: inline-block;

      margin-top: 10px;

      padding: 10px 14px;

      border-radius: 10px;

      background: #10b981;

      color: white;

      text-decoration: none;

      font-weight: 700;

    }

    textarea {

      width: 100%;

      min-height: 240px;

      resize: vertical;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      padding: 12px;

      font-family: monospace;

      font-size: 12px;

      line-height: 1.5;

      box-sizing: border-box;

      margin-top: 14px;

    }

  </style>

</head>

<body>

  <div class="wrap">

    <h1>ListNote アイコン生成</h1>

    <p>

      このページは <strong>アイコンPNGを作るためのページ</strong> です。<br>

      うまく自動ダウンロードできない端末では、表示された画像を <strong>長押し保存</strong> してください。

    </p>

 

    <div class="card">

      <button onclick="generateIcons()">アイコンを生成する</button>

      <div class="msg" id="message">まだ生成していません。</div>

 

      <textarea id="svgInput"><svg xmlns=http://www.w3.org/2000/svg viewBox="0 0 512 512">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0%" stop-color="#5B5BF7"/>

      <stop offset="100%" stop-color="#3B82F6"/>

    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">

      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.18"/>

    </filter>

  </defs>

 

  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)"/>

 

  <g filter="url(#shadow)">

    <rect x="112" y="112" width="288" height="288" rx="44" fill="#ffffff"/>

  </g>

 

  <circle cx="164" cy="186" r="16" fill="#5B5BF7"/>

  <rect x="196" y="172" width="140" height="28" rx="14" fill="#D6DBFF"/>

 

  <circle cx="164" cy="256" r="16" fill="#5B5BF7"/>

  <rect x="196" y="242" width="140" height="28" rx="14" fill="#D6DBFF"/>

 

  <circle cx="164" cy="326" r="16" fill="#5B5BF7"/>

  <rect x="196" y="312" width="100" height="28" rx="14" fill="#D6DBFF"/>

 

  <path d="M316 326l28 28 52-60" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

</svg></textarea>

 

      <div class="grid" id="iconsGrid"></div>

    </div>

  </div>

 

  <script>

    function makeDataUrl(size, callback) {

      const svgText = document.getElementById('svgInput').value.trim();

      const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });

      const url = URL.createObjectURL(svgBlob);

 

      const img = new Image();

      img.onload = function () {

        const canvas = document.createElement('canvas');

        canvas.width = size;

        canvas.height = size;

        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, size, size);

        ctx.drawImage(img, 0, 0, size, size);

 

        const dataUrl = canvas.toDataURL('image/png');

        URL.revokeObjectURL(url);

        callback(dataUrl);

      };

      img.onerror = function () {

        document.getElementById('message').textContent = 'SVGの読み込みに失敗しました。';

        URL.revokeObjectURL(url);

      };

      img.src = url;

    }

 

    function createIconCard(size, dataUrl) {

      const grid = document.getElementById('iconsGrid');

      const div = document.createElement('div');

      div.className = 'item';

 

      div.innerHTML = `

        <div class="filename">icon-${size}.png</div>

        <img src="${dataUrl}" alt="icon-${size}">

        <div class="help">

          PCなら「画像を新しいタブで開く」→保存。<br>

          iPhoneなら画像を長押しして「写真に保存」または「ファイルに保存」してください。

        </div>

        <a class="save-link" href="${dataUrl}" download="icon-${size}.png" target="_blank">保存用に開く</a>

      `;

 

      grid.appendChild(div);

    }

 

    function generateIcons() {

      document.getElementById('iconsGrid').innerHTML = '';

      document.getElementById('message').textContent = '生成中...';

 

      const sizes = [180, 192, 512];

      let done = 0;

 

      sizes.forEach(size => {

        makeDataUrl(size, function(dataUrl) {

          createIconCard(size, dataUrl);

          done++;

          if (done === sizes.length) {

            document.getElementById('message').textContent =

              '生成できました。保存用に開くを押すか、画像を長押しして保存してください。';

          }

        });

      });

    }

 

    generateIcons();

  </script>

</body>

</html>
