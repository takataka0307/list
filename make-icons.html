<!doctype html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>ListNote PNGアイコン生成</title>

  <style>

    body {

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f7fb;

      color: #1f2937;

    }

    .wrap {

      max-width: 900px;

      margin: 0 auto;

    }

    h1 { margin: 0 0 10px; font-size: 28px; }

    p { line-height: 1.7; color: #4b5563; }

    .card {

      background: white;

      border-radius: 16px;

      padding: 18px;

      box-shadow: 0 8px 24px rgba(0,0,0,0.08);

      margin-top: 16px;

    }

    textarea {

      width: 100%;

      min-height: 320px;

      resize: vertical;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      padding: 12px;

      font-family: monospace;

      font-size: 13px;

      line-height: 1.5;

      box-sizing: border-box;

    }

    .buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 16px;

    }

    button {

      border: none;

      background: #5B5BF7;

      color: white;

      padding: 12px 16px;

      border-radius: 12px;

      cursor: pointer;

      font-size: 14px;

      font-weight: 700;

    }

    .preview {

      display: flex;

      gap: 16px;

      flex-wrap: wrap;

      align-items: center;

      margin-top: 16px;

    }

    .preview-box {

      background: #fff;

      border: 1px solid #e5e7eb;

      border-radius: 16px;

      padding: 14px;

      text-align: center;

      min-width: 140px;

    }

    .preview-box img {

      width: 96px;

      height: 96px;

      display: block;

      margin: 0 auto 10px;

      border-radius: 22px;

    }

    .msg {

      margin-top: 12px;

      font-size: 14px;

      color: #2563eb;

      font-weight: 600;

    }

  </style>

</head>

<body>

  <div class="wrap">

    <h1>ListNote PNGアイコン生成</h1>

    <p>このページは PNGアイコンを作るための道具です。</p>

 

    <div class="card">

      <textarea id="svgInput"><svg xmlns=http://www.w3.org/2000/svg viewBox="0 0 512 512">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0%" stop-color="#5B5BF7"/>

      <stop offset="100%" stop-color="#3B82F6"/>

    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">

      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.18"/>

    </filter>

  </defs>

 

  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)"/>

 

  <g filter="url(#shadow)">

    <rect x="112" y="112" width="288" height="288" rx="44" fill="#ffffff"/>

  </g>

 

  <circle cx="164" cy="186" r="16" fill="#5B5BF7"/>

  <rect x="196" y="172" width="140" height="28" rx="14" fill="#D6DBFF"/>

 

  <circle cx="164" cy="256" r="16" fill="#5B5BF7"/>

  <rect x="196" y="242" width="140" height="28" rx="14" fill="#D6DBFF"/>

 

  <circle cx="164" cy="326" r="16" fill="#5B5BF7"/>

  <rect x="196" y="312" width="100" height="28" rx="14" fill="#D6DBFF"/>

 

  <path d="M316 326l28 28 52-60" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

</svg></textarea>

 

      <div class="buttons">

        <button onclick="downloadPng(180)">icon-180.png を作る</button>

        <button onclick="downloadPng(192)">icon-192.png を作る</button>

        <button onclick="downloadPng(512)">icon-512.png を作る</button>

      </div>

 

      <div class="msg" id="message"></div>

 

      <div class="preview">

        <div class="preview-box">

          <img id="previewImg" alt="preview">

          <div>プレビュー</div>

        </div>

      </div>

    </div>

  </div>

 

  <script>

    function updatePreview() {

      const svgText = document.getElementById('svgInput').value.trim();

      const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });

      const url = URL.createObjectURL(blob);

      const img = document.getElementById('previewImg');

      img.onload = () => URL.revokeObjectURL(url);

      img.src = url;

    }

 

    function downloadPng(size) {

      const svgText = document.getElementById('svgInput').value.trim();

      const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });

      const url = URL.createObjectURL(svgBlob);

 

      const img = new Image();

      img.onload = function () {

        const canvas = document.createElement('canvas');

        canvas.width = size;

        canvas.height = size;

        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, size, size);

        ctx.drawImage(img, 0, 0, size, size);

 

        canvas.toBlob(function (pngBlob) {

          const pngUrl = URL.createObjectURL(pngBlob);

          const a = document.createElement('a');

          a.href = pngUrl;

          a.download = `icon-${size}.png`;

          document.body.appendChild(a);

          a.click();

          a.remove();

          document.getElementById('message').textContent = `icon-${size}.png を保存しました。`;

          setTimeout(() => {

            URL.revokeObjectURL(url);

            URL.revokeObjectURL(pngUrl);

          }, 1000);

        }, 'image/png');

      };

 

      img.src = url;

    }

 

    updatePreview();

  </script>

</body>

</html>
