<!doctype html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>ListNote アイコン生成</title>

  <style>

    body {

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f7fb;

      color: #1f2937;

    }

    .wrap {

      max-width: 900px;

      margin: 0 auto;

    }

    h1 {

      margin: 0 0 10px;

      font-size: 28px;

    }

    p {

      line-height: 1.7;

      color: #4b5563;

    }

    .card {

      background: white;

      border-radius: 16px;

      padding: 18px;

      box-shadow: 0 8px 24px rgba(0,0,0,0.08);

      margin-top: 16px;

    }

    button {

      border: none;

      background: #5B5BF7;

      color: white;

      padding: 12px 16px;

      border-radius: 12px;

      cursor: pointer;

      font-size: 14px;

      font-weight: 700;

      margin-right: 8px;

      margin-bottom: 8px;

    }

    .msg {

      margin-top: 12px;

      font-size: 14px;

      color: #2563eb;

      font-weight: 600;

    }

    .grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

      gap: 16px;

      margin-top: 16px;

    }

    .item {

      border: 1px solid #e5e7eb;

      border-radius: 16px;

      padding: 16px;

      text-align: center;

      background: #fff;

    }

    .item img {

      width: 120px;

      height: 120px;

      border-radius: 24px;

      display: block;

      margin: 0 auto 12px;

      background: #f3f4f6;

    }

    .filename {

      font-weight: 700;

      margin-bottom: 8px;

    }

    .help {

      font-size: 13px;

      color: #6b7280;

      line-height: 1.6;

    }

    a.save-link {

      display: inline-block;

      margin-top: 10px;

      padding: 10px 14px;

      border-radius: 10px;

      background: #10b981;

      color: white;

      text-decoration: none;

      font-weight: 700;

    }

  </style>

</head>

<body>

  <div class="wrap">

    <h1>ListNote アイコン生成</h1>

    <p>

      これは <strong>PNGアイコンを作る専用ページ</strong> です。<br>

      画像が表示されたら、PCなら保存、iPhoneなら長押し保存してください。

    </p>

 

    <div class="card">

      <button onclick="generateIcons()">アイコンを生成する</button>

      <div class="msg" id="message">まだ生成していません。</div>

      <div class="grid" id="iconsGrid"></div>

    </div>

  </div>

 

  <script>

    function roundRect(ctx, x, y, w, h, r) {

      ctx.beginPath();

      ctx.moveTo(x + r, y);

      ctx.lineTo(x + w - r, y);

      ctx.quadraticCurveTo(x + w, y, x + w, y + r);

      ctx.lineTo(x + w, y + h - r);

      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);

      ctx.lineTo(x + r, y + h);

      ctx.quadraticCurveTo(x, y + h, x, y + h - r);

      ctx.lineTo(x, y + r);

      ctx.quadraticCurveTo(x, y, x + r, y);

      ctx.closePath();

    }

 

    function drawIcon(size) {

      const canvas = document.createElement('canvas');

      canvas.width = size;

      canvas.height = size;

      const ctx = canvas.getContext('2d');

 

      // 背景

      const grad = ctx.createLinearGradient(0, 0, size, size);

      grad.addColorStop(0, '#5B5BF7');

      grad.addColorStop(1, '#3B82F6');

      ctx.fillStyle = grad;

      roundRect(ctx, size * 0.0625, size * 0.0625, size * 0.875, size * 0.875, size * 0.21);

      ctx.fill();

 

      // 白いカード

      ctx.shadowColor = 'rgba(0,0,0,0.15)';

      ctx.shadowBlur = size * 0.03;

      ctx.shadowOffsetY = size * 0.015;

      ctx.fillStyle = '#ffffff';

      roundRect(ctx, size * 0.22, size * 0.22, size * 0.56, size * 0.56, size * 0.085);

      ctx.fill();

 

      // 影解除

      ctx.shadowColor = 'transparent';

      ctx.shadowBlur = 0;

      ctx.shadowOffsetY = 0;

 

      // リストの丸

      const dots = [0.365, 0.5, 0.635];

      dots.forEach(y => {

        ctx.beginPath();

        ctx.arc(size * 0.32, size * y, size * 0.031, 0, Math.PI * 2);

        ctx.fillStyle = '#5B5BF7';

        ctx.fill();

      });

 

      // リストの線

      const lines = [

        { y: 0.336, w: 0.27 },

        { y: 0.471, w: 0.27 },

        { y: 0.606, w: 0.19 }

      ];

      lines.forEach(line => {

        ctx.fillStyle = '#D6DBFF';

        roundRect(ctx, size * 0.385, size * line.y, size * line.w, size * 0.055, size * 0.027);

        ctx.fill();

      });

 

      // チェック

      ctx.strokeStyle = '#10B981';

      ctx.lineWidth = size * 0.047;

      ctx.lineCap = 'round';

      ctx.lineJoin = 'round';

      ctx.beginPath();

      ctx.moveTo(size * 0.617, size * 0.635);

      ctx.lineTo(size * 0.672, size * 0.69);

      ctx.lineTo(size * 0.773, size * 0.573);

      ctx.stroke();

 

      return canvas.toDataURL('image/png');

    }

 

    function createIconCard(size, dataUrl) {

      const grid = document.getElementById('iconsGrid');

      const div = document.createElement('div');

      div.className = 'item';

      div.innerHTML = `

        <div class="filename">icon-${size}.png</div>

        <img src="${dataUrl}" alt="icon-${size}">

        <div class="help">

          PCなら「保存用に開く」を押して保存。<br>

          iPhoneなら画像を長押しして「写真に保存」または「ファイルに保存」してください。

        </div>

        <a class="save-link" href="${dataUrl}" download="icon-${size}.png" target="_blank">保存用に開く</a>

      `;

      grid.appendChild(div);

    }

 

    function generateIcons() {

      const grid = document.getElementById('iconsGrid');

      grid.innerHTML = '';

      document.getElementById('message').textContent = '生成しました。保存してください。';

 

      [180, 192, 512].forEach(size => {

        const dataUrl = drawIcon(size);

        createIconCard(size, dataUrl);

      });

    }

 

    generateIcons();

  </script>

</body>

</html>
